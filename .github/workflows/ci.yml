name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      # Remaining "high" advisories sit in the Expo/Metro build toolchain
      # (not shipped in the app) and only clear with SDK upgrades; Dependabot
      # tracks those. Critical ones fail the build.
      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=critical
